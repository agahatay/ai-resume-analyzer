# Phase 12: single-page static app - no server-side routes to proxy (the
# app has no client-side router, see App.tsx, but try_files keeps this
# correct if one is added later). The backend is reached directly by the
# browser via VITE_API_BASE_URL baked in at build time, not through nginx.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
