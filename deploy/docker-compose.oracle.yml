# Oracle Cloud Always Free deployment: a single ARM (Ampere A1) VM runs the
# whole stack. Unlike docker-compose.prod.yml, images are BUILT ON THE SERVER
# (the VM is arm64), and only Caddy is published to the internet: it serves
# HTTPS on one domain, sending /api/* to the backend and everything else to
# the frontend. Postgres, backend and frontend have no host ports at all.
#
# Run from the repo root on the server:
#   docker compose -f deploy/docker-compose.oracle.yml --env-file deploy/.env up -d --build

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ai_resume_analyzer}"]
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_resume_analyzer}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck: *postgres-healthcheck

  backend:
    build:
      context: ../backend
    image: ai-resume-analyzer-backend:oracle
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ai_resume_analyzer}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SEMANTIC_MODEL_NAME: ${SEMANTIC_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.3}
      CORS_ORIGINS: https://${DOMAIN:?DOMAIN must be set}
      ENVIRONMENT: production
      DEBUG: "false"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      args:
        # Same origin as the page: Caddy routes /api/* to the backend.
        VITE_API_BASE_URL: https://${DOMAIN:?DOMAIN must be set}
    image: ai-resume-analyzer-frontend:oracle
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  hf_cache:
  caddy_data:
  caddy_config:
