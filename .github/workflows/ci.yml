name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests (pytest, alembic, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ai_resume_analyzer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_resume_analyzer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ai_resume_analyzer_test
      DB_USER: postgres
      DB_PASSWORD: ci_test_password_only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SEMANTIC_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      SEMANTIC_SIMILARITY_THRESHOLD: "0.3"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Generate CI-only JWT secret
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Python syntax and import check
        run: |
          python -m compileall -q app
          python -c "import app.main"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify models match migrations (alembic check)
        run: alembic check

      - name: Run backend test suite
        run: pytest -v

  frontend:
    name: Frontend Typecheck, Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

      - name: Lint
        run: npm run lint

  e2e:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ai_resume_analyzer_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_resume_analyzer_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ai_resume_analyzer_e2e
      DB_USER: postgres
      DB_PASSWORD: ci_test_password_only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SEMANTIC_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      SEMANTIC_SIMILARITY_THRESHOLD: "0.3"
      CORS_ORIGINS: http://localhost:5173
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Generate CI-only JWT secret
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend server
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
          timeout 60 sh -c 'until curl -sf http://localhost:8000/api/health; do sleep 2; done'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend preview server
        working-directory: frontend
        run: |
          nohup npm run preview -- --port 5173 --strictPort > ../frontend.log 2>&1 &
          timeout 60 sh -c 'until curl -sf http://localhost:5173; do sleep 2; done'

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log
          retention-days: 7

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CI-only compose env file
        run: |
          cat > .env <<EOF
          DB_NAME=ai_resume_analyzer
          DB_USER=postgres
          DB_PASSWORD=ci_docker_test_password_only
          JWT_SECRET_KEY=$(openssl rand -hex 32)
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          SEMANTIC_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
          SEMANTIC_SIMILARITY_THRESHOLD=0.3
          CORS_ORIGINS=http://localhost:5173
          POSTGRES_PORT=5432
          BACKEND_PORT=8000
          FRONTEND_PORT=5173
          VITE_API_BASE_URL=http://localhost:8000
          EOF

      - name: Validate docker-compose configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          tags: ai-resume-analyzer-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          tags: ai-resume-analyzer-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start PostgreSQL container and verify healthy
        run: |
          docker compose up -d postgres
          timeout 60 sh -c 'until docker compose ps postgres | grep -q "healthy"; do sleep 2; done'
          docker compose ps postgres
          docker compose down -v
