name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests (pytest, alembic, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ai_resume_analyzer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_resume_analyzer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ai_resume_analyzer_test
      DB_USER: postgres
      DB_PASSWORD: ci_test_password_only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SEMANTIC_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      SEMANTIC_SIMILARITY_THRESHOLD: "0.3"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Generate CI-only JWT secret
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Python syntax and import check
        run: |
          python -m compileall -q app
          python -c "import app.main"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify models match migrations (alembic check)
        run: alembic check

      - name: Run backend test suite
        run: pytest -v

  frontend:
    name: Frontend Typecheck, Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

      - name: Lint
        run: npm run lint
